# This workflow lints, tests, and builds the client.
name: client ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

jobs:
  build:
    name: Lint, test, and build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "client"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: "client/package-lock.json"
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm run test
    - name: Build
      run: npm run build
