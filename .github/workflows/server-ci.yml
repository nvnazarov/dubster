# This workflow checks formatting, tests, and builds the server.
name: server ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  build:
    name: check formatting, test, and build server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "server"
    steps:
    - name: checkout repository
      uses: actions/checkout@v4
    - name: setup go
      uses: actions/setup-go@v4
      with:
        go-version: "1.27"
    - name: check formatting
      run: make format-check
    - name: test
      run: make test
    - name: build
      run: make build
