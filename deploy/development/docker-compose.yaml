name: "dubster"

services:
  client:
    build:
      context: "../../client"
      target: "development"
    environment:
      NODE_ENV: "development"
      NEXT_PUBLIC__BACKEND_BASE_URL: "http://localhost:8080/api"
    volumes:
      - "../../client:/app"
      - "/app/node_modules"
      - "/app/.next"
    ports:
      - "3000:3000"
    networks:
      - "private"

  server:
    build:
      context: "../../server"
      target: "development"
    environment:
      DUBSTER__SERVER__HOST: "0.0.0.0"
      DUBSTER__SERVER__PORT: 80
      DUBSTER__SERVER__CORS__ALLOWED_ORIGINS: "http://localhost:3000"
      DUBSTER__POSTGRES__DB: "dubster"
      DUBSTER__POSTGRES__USER: "postgres"
      DUBSTER__POSTGRES__PASSWORD: "postgres"
      DUBSTER__POSTGRES__HOST: "postgres"
      DUBSTER__POSTGRES__PORT: 5432
      DUBSTER__S3__ACCESS_KEY: "access-key"
      DUBSTER__S3__SECRET_KEY: "secret-key"
      DUBSTER__S3__ENDPOINT: "http://seaweedfs:8333/"
      DUBSTER__S3__PUBLIC_ENDPOINT: "http://localhost:8333/"
      DUBSTER__S3__RENDERS__BUCKET: "renders"
      DUBSTER__S3__RENDERS__DOWNLOAD_EXPIRY: "30m"
      DUBSTER__S3__RECORDINGS__BUCKET: "recordings"
      DUBSTER__S3__RECORDINGS__UPLOAD_EXPIRY: "5m"
      DUBSTER__S3__CLIPS__BUCKET: "clips"
      DUBSTER__S3__CLIPS__DOWNLOAD_EXPIRY: "30m"
      DUBSTER__S3__CLIPS__UPLOAD_EXPIRY: "30m"
      DUBSTER__SESSION__MAX_PARTICIPANTS: 10
      DUBSTER__SESSION__EXPIRY: "1h"
      DUBSTER__SESSION__MAX_RECORDING_SIZE: "256kb"
      DUBSTER__CLIP__MAX_SIZE: "100mb"
      DUBSTER__CLIP__MAX_DURATION: "5m"
      DUBSTER__CLIP__MAX_ROLES: 10
      DUBSTER__CLIP__MAX_SEGMENTS: 100
      DUBSTER__LOGS_LEVEL: "debug"
    volumes:
      - "../../server:/app"
      - "go-mod-cache:/go/pkg/mod"
    ports:
      - "8080:80"
    networks:
      - "private"
    depends_on:
      postgres:
        condition: "service_healthy"
      seaweedfs:
        condition: "service_healthy"

  postgres:
    image: "postgres"
    volumes:
      - "postgres:/var/lib/postgresql"
      - "./migrations:/docker-entrypoint-initdb.d/"
    environment:
      POSTGRES_DB: "dubster"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    networks:
      - "private"
    healthcheck:
      test: "pg_isready -U postgres"
      interval: "10s"
      timeout: "5s"
      retries: 3

  seaweedfs:
    image: "chrislusf/seaweedfs:latest"
    command: "mini -dir=/data"
    environment:
      AWS_ACCESS_KEY_ID: "access-key"
      AWS_SECRET_ACCESS_KEY: "secret-key"
      S3_EXTERNAL_URL: "http://localhost:8333"
    volumes:
      - "seaweedfs:/data"
    networks:
      - "private"
    ports:
      - "8333:8333"
      - "9333:9333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9333/cluster/status || exit 1",
        ]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "15s"

networks:
  private: {}

volumes:
  postgres: {}
  seaweedfs: {}
  go-mod-cache: {}
