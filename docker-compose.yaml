name: dubster

services:
  # client:
  #   build:
  #     context: "./client"
  #     target: "runner"
  #     # args:
  #     #   - "NEXT_PUBLIC__BACKEND_BASE_URL=http://localhost:8080/api/v1"
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - "private"

  server:
    build:
      context: "./server"
      target: "production"
    networks:
      - "private"
    depends_on:
      postgres:
        condition: "service_healthy"
      seaweedfs:
        condition: "service_healthy"

  postgres:
    image: "postgres"
    volumes:
      - "postgres:/var/lib/postgresql"
    environment:
      - "POSTGRES_DB=${DUBSTER__SERVER__POSTGRES__DB?}"
      - "POSTGRES_USER=${DUBSTER__SERVER__POSTGRES__USER?}"
      - "POSTGRES_PASSWORD=${DUBSTER__SERVER__POSTGRES__PASSWORD?}"
    networks:
      - "private"
    healthcheck:
      test: "pg_isready -U ${DUBSTER__SERVER__POSTGRES__USER?}"
      interval: "10s"
      timeout: "5s"
      retries: 3

  seaweedfs:
    image: "chrislusf/seaweedfs:latest"
    command: "mini -dir=/data"
    environment:
      AWS_ACCESS_KEY_ID: ${DUBSTER__SERVER__S3__ACCESS_KEY?}
      AWS_SECRET_ACCESS_KEY: ${DUBSTER__SERVER__S3__SECRET_KEY?}
    volumes:
      - "seaweedfs:/data"
    networks:
      - "private"
    ports:
      - "9333:9333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9333/cluster/status || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  private: {}

volumes:
  postgres: {}
  seaweedfs: {}
